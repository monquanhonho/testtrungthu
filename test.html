<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cây Hạt Tím - Trung Thu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #030308;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    #info {
      position: absolute;
      bottom: 18px;
      left: 18px;
      color: #d8a0ff;
      font-size: 13px;
      opacity: 0.65;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(180, 80, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="info">Kéo chuột để xoay • Cuộn để zoom</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==================== SCENE ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030308);
    scene.fog = new THREE.FogExp2(0x030308, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(4, 9, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 7;
    controls.maxDistance = 40;
    controls.target.set(0, 6.5, 0);

    // ==================== LIGHTS ====================
    scene.add(new THREE.AmbientLight(0x1a1525, 0.7));

    const moonLight = new THREE.DirectionalLight(0xfff4d6, 1.6);
    moonLight.position.set(12, 22, -8);
    scene.add(moonLight);

    const fillLight = new THREE.DirectionalLight(0x8866ff, 0.35);
    fillLight.position.set(-10, 8, 10);
    scene.add(fillLight);

    // ==================== MATERIALS ====================
    const rabbitFurMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffffea,
      emissiveIntensity: 0.4,
      roughness: 0.6,
    });

    const rabbitPinkMat = new THREE.MeshStandardMaterial({
      color: 0xffa0b8,
      emissive: 0x662030,
      emissiveIntensity: 0.3,
      roughness: 0.55,
    });

    const rabbitEyeMat = new THREE.MeshStandardMaterial({
      color: 0x180800,
      roughness: 0.12,
      metalness: 0.85,
    });

    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x1c1410,
      roughness: 0.92,
      flatShading: true,
    });

    // ==================== TẢNG ĐÁ ====================
    const rock = new THREE.Mesh(
      new THREE.SphereGeometry(6.2, 18, 14),
      new THREE.MeshStandardMaterial({
        color: 0x1e1a28,
        roughness: 0.95,
        flatShading: true,
      })
    );
    rock.scale.set(1.7, 0.52, 1.35);
    rock.position.y = -0.6;
    scene.add(rock);

    // ==================== THỎ ====================
    function createRabbit() {
      const g = new THREE.Group();

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.52, 20, 20), rabbitFurMat);
      body.scale.set(1.05, 1.2, 0.95);
      g.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 18, 18), rabbitFurMat);
      head.position.set(0, 0.68, 0.18);
      g.add(head);

      // Tai
      const earGeo = new THREE.CapsuleGeometry(0.11, 0.58, 6, 10);
      const leftEar = new THREE.Mesh(earGeo, rabbitFurMat);
      leftEar.position.set(-0.17, 1.12, 0.06);
      leftEar.rotation.z = 0.28;
      g.add(leftEar);

      const rightEar = new THREE.Mesh(earGeo, rabbitFurMat);
      rightEar.position.set(0.17, 1.12, 0.06);
      rightEar.rotation.z = -0.28;
      g.add(rightEar);

      // Tai trong hồng
      const innerGeo = new THREE.CapsuleGeometry(0.065, 0.42, 4, 8);
      const leftInner = new THREE.Mesh(innerGeo, rabbitPinkMat);
      leftInner.position.set(-0.17, 1.12, 0.09);
      leftInner.rotation.z = 0.28;
      g.add(leftInner);

      const rightInner = new THREE.Mesh(innerGeo, rabbitPinkMat);
      rightInner.position.set(0.17, 1.12, 0.09);
      rightInner.rotation.z = -0.28;
      g.add(rightInner);

      // Mắt
      const eyeGeo = new THREE.SphereGeometry(0.065, 10, 10);
      const leftEye = new THREE.Mesh(eyeGeo, rabbitEyeMat);
      leftEye.position.set(-0.13, 0.73, 0.36);
      g.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, rabbitEyeMat);
      rightEye.position.set(0.13, 0.73, 0.36);
      g.add(rightEye);

      // Má hồng
      const cheek = new THREE.SphereGeometry(0.09, 8, 8);
      const leftCheek = new THREE.Mesh(cheek, rabbitPinkMat);
      leftCheek.position.set(-0.27, 0.6, 0.26);
      leftCheek.scale.set(1, 0.65, 0.55);
      g.add(leftCheek);
      const rightCheek = new THREE.Mesh(cheek, rabbitPinkMat);
      rightCheek.position.set(0.27, 0.6, 0.26);
      rightCheek.scale.set(1, 0.65, 0.55);
      g.add(rightCheek);

      // Chân
      const legGeo = new THREE.CapsuleGeometry(0.11, 0.22, 4, 8);
      [-0.24, 0.24].forEach(x => {
        const leg = new THREE.Mesh(legGeo, rabbitFurMat);
        leg.position.set(x, -0.48, 0.22);
        g.add(leg);
      });

      g.position.set(2.1, 2.7, 3.8);
      g.scale.setScalar(0.9);
      g.rotation.y = -0.45;
      return g;
    }
    scene.add(createRabbit());

    // ==================== CÂY (thân + cành rõ) ====================
    function createTree() {
      const group = new THREE.Group();

      // Thân chính chắc chắn
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.85, 8.2, 7),
        trunkMat
      );
      trunk.position.y = 3.9;
      group.add(trunk);

      // Các cành chính (dày và rõ)
      const branchData = [
        // cành lớn
        { pos: [0.9, 7.0, 0.4],  rot: [0.35, 0.5, 1.05],  len: 4.2, r: 0.22 },
        { pos: [-1.0, 7.6, -0.3], rot: [0.25,-0.55,-1.1],  len: 4.0, r: 0.20 },
        { pos: [0.4, 9.2, 0.6],  rot: [-0.45, 0.35, 0.55], len: 3.4, r: 0.17 },
        { pos: [-0.5, 9.6, -0.5],rot: [0.15,-0.25,-0.7],  len: 3.1, r: 0.16 },
        { pos: [1.2, 5.8, -0.6], rot: [0.55, 0.7, 1.25],  len: 2.8, r: 0.15 },
        { pos: [-1.3, 6.3, 0.7], rot: [-0.35,-0.75,-1.15],len: 3.0, r: 0.16 },
        // cành phụ
        { pos: [1.8, 8.8, 1.0],  rot: [0.2, 0.8, 0.9],    len: 2.2, r: 0.11 },
        { pos: [-1.9, 9.1,-0.9],  rot: [0.15,-0.7,-0.85],  len: 2.3, r: 0.11 },
        { pos: [0.6, 11.0, 0.3], rot: [0.1, 0.15, 0.25],  len: 2.0, r: 0.10 },
        { pos: [-0.7, 10.6,-0.4],rot: [0.05,-0.2,-0.35],  len: 1.9, r: 0.09 },
        { pos: [2.2, 6.8, 0.2],  rot: [0.4, 1.1, 0.6],    len: 1.8, r: 0.09 },
        { pos: [-2.3, 7.2, 0.1], rot: [-0.3,-1.0,-0.7],   len: 1.9, r: 0.09 },
      ];

      branchData.forEach(b => {
        const branch = new THREE.Mesh(
          new THREE.CylinderGeometry(b.r * 0.35, b.r, b.len, 6),
          trunkMat
        );
        branch.position.set(...b.pos);
        branch.rotation.set(...b.rot);
        group.add(branch);
      });

      return group;
    }
    scene.add(createTree());

    // ==================== HẠT TÍM (tán cây rõ) ====================
    function createCanopyParticles() {
      const count = 6500;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);

      const c1 = new THREE.Color(0xff55bb);
      const c2 = new THREE.Color(0xbb44ff);
      const c3 = new THREE.Color(0xff99ee);
      const c4 = new THREE.Color(0xee66ff);

      for (let i = 0; i < count; i++) {
        // Phân bố theo hình elip dẹt + cao (tán cây)
        const theta = Math.random() * Math.PI * 2;
        const r = Math.pow(Math.random(), 0.65) * 9.5; // dày hơn ở giữa
        const h = Math.random();

        // Chiều cao tán: từ ~5.5 đến ~14
        const y = 5.8 + h * 8.5;

        // Bán kính thay đổi theo chiều cao (hình dù)
        let radiusFactor = 1.0;
        if (y < 8) radiusFactor = 0.75 + (y - 5.8) * 0.12;
        else if (y > 12) radiusFactor = 1.3 - (y - 12) * 0.25;

        const x = Math.cos(theta) * r * radiusFactor * (0.85 + Math.random() * 0.3);
        const z = Math.sin(theta) * r * radiusFactor * (0.85 + Math.random() * 0.3);

        positions[i * 3]     = x;
        positions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.8;
        positions[i * 3 + 2] = z;

        // Màu
        const rnd = Math.random();
        let col = rnd < 0.3 ? c1 : rnd < 0.55 ? c2 : rnd < 0.8 ? c3 : c4;
        // Một số hạt sáng hơn
        if (Math.random() > 0.85) col = col.clone().multiplyScalar(1.3);

        colors[i * 3]     = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;

        sizes[i] = 0.07 + Math.random() * 0.28;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.PointsMaterial({
        size: 0.32,
        vertexColors: true,
        transparent: true,
        opacity: 0.88,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true,
      });

      return new THREE.Points(geo, mat);
    }
    const canopy = createCanopyParticles();
    scene.add(canopy);

    // Hạt rơi nhẹ
    function createFallingPetals() {
      const count = 350;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * 18;
        positions[i * 3 + 1] = 6 + Math.random() * 12;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 18;

        const col = new THREE.Color().setHSL(0.88 + Math.random() * 0.08, 0.75, 0.65);
        colors[i * 3] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;

        velocities.push({
          y: -0.008 - Math.random() * 0.015,
          x: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.01,
        });
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.18,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });

      const points = new THREE.Points(geo, mat);
      points.userData.velocities = velocities;
      return points;
    }
    const falling = createFallingPetals();
    scene.add(falling);

    // Hạt lơ lửng xa
    function createAmbientParticles() {
      const count = 600;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * 45;
        positions[i * 3 + 1] = Math.random() * 22;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 45;

        const col = new THREE.Color().setHSL(0.82 + Math.random() * 0.12, 0.6, 0.55);
        colors[i * 3] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      return new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.11,
        vertexColors: true,
        transparent: true,
        opacity: 0.5,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      }));
    }
    scene.add(createAmbientParticles());

    // ==================== MẶT TRĂNG ====================
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(3.1, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xfff6e0 })
    );
    moon.position.set(9, 17, -14);
    scene.add(moon);

    // Glow nhiều lớp
    [3.8, 5.0, 6.8].forEach((r, i) => {
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(r, 32, 32),
        new THREE.MeshBasicMaterial({
          color: i === 0 ? 0xffe8b0 : 0xffd080,
          transparent: true,
          opacity: 0.12 - i * 0.03,
          side: THREE.BackSide,
        })
      );
      moon.add(glow);
    });

    // ==================== ĐÈN LỒNG ====================
    function createLantern(x, y, z, scale = 1, intensity = 2.8) {
      const g = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.15, 1.55, 1.15),
        new THREE.MeshStandardMaterial({
          color: 0xff3a00,
          emissive: 0xff2200,
          emissiveIntensity: 1.1,
          roughness: 0.35,
        })
      );
      g.add(body);

      const top = new THREE.Mesh(
        new THREE.ConeGeometry(0.85, 0.48, 4),
        new THREE.MeshStandardMaterial({
          color: 0xffb000,
          emissive: 0xff8800,
          emissiveIntensity: 0.7,
        })
      );
      top.position.y = 1.02;
      top.rotation.y = Math.PI / 4;
      g.add(top);

      const bottom = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 0.14, 0.75, 8),
        new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff8800, emissiveIntensity: 0.4 })
      );
      bottom.position.y = -1.08;
      g.add(bottom);

      const light = new THREE.PointLight(0xff5522, intensity, 14, 1.5);
      light.position.y = 0.1;
      g.add(light);

      g.position.set(x, y, z);
      g.scale.setScalar(scale);
      return g;
    }

    scene.add(createLantern(7.5, 4.2, 5.5, 0.95, 3.2));
    scene.add(createLantern(-8.5, 7.5, -2.5, 0.72, 2.4));
    scene.add(createLantern(11, 10, -7, 0.55, 1.8));
    scene.add(createLantern(-6.5, 12, 3.5, 0.48, 1.6));
    scene.add(createLantern(4, 13.5, -4, 0.4, 1.3));

    // ==================== ANIMATION ====================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Tán cây xoay rất chậm
      canopy.rotation.y = t * 0.025;

      // Hạt rơi
      const pos = falling.geometry.attributes.position.array;
      const vels = falling.userData.velocities;
      for (let i = 0; i < vels.length; i++) {
        const idx = i * 3;
        pos[idx]     += vels[i].x + Math.sin(t * 0.7 + i) * 0.002;
        pos[idx + 1] += vels[i].y;
        pos[idx + 2] += vels[i].z;

        // Reset khi rơi xuống đất
        if (pos[idx + 1] < 1.5) {
          pos[idx + 1] = 12 + Math.random() * 6;
          pos[idx]     = (Math.random() - 0.5) * 16;
          pos[idx + 2] = (Math.random() - 0.5) * 16;
        }
      }
      falling.geometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
