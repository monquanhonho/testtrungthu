<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cơn Mưa Hoa Đăng</title>
  <style>
    :root {
      --corner-image-width: min(34vw, 480px);
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      overflow: hidden;
      background: radial-gradient(ellipse at top, #071428 0%, #02040a 60%, #000 100%);
      color: #fff;
      font-family: Inter, system-ui, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0
    }

    .corner-lantern {
      position: fixed;
      z-index: 2;
      right: 0;
      bottom: 0;
      width: var(--corner-image-width);
      max-width: 82vw;
      height: auto;
      transform-origin: 50% 100%;
      filter: drop-shadow(-12px -8px 18px rgba(255, 155, 71, 0.28));
      pointer-events: none;
    }

    .corner-lantern::after {
      content: none
    }

    @media (max-width: 600px) {
      :root {
        --corner-image-width: min(72vw, 360px)
      }
    }

    .credit {
      position: fixed;
      right: 12px;
      bottom: 12px;
      color: #9fb6c9;
      font-size: 12px;
      opacity: 0.8;
    }

    /* Popup ảnh khi bấm vào lồng đèn */
    .photo-popup {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }

    .photo-popup.show {
      opacity: 1;
      visibility: visible;
    }

    .photo-card {
      position: relative;
      width: min(76vw, 430px);
      max-height: 78vh;
      padding: 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .10);
      border: 1px solid rgba(255, 221, 163, .45);
      box-shadow: 0 0 35px rgba(255, 176, 74, .28), 0 25px 70px rgba(0, 0, 0, .55);
      transform: scale(.65) translateY(35px) rotate(-2deg);
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }

    .photo-popup.show .photo-card {
      transform: scale(1) translateY(0) rotate(0deg);
    }

    .photo-card img {
      display: block;
      width: 100%;
      max-height: calc(78vh - 24px);
      object-fit: contain;
      border-radius: 17px;
      user-select: none;
    }

    .photo-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #fff7e7;
      color: #6b3d17;
      font-size: 23px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .35);
    }

    .photo-hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 5;
      transform: translateX(-50%);
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(3, 10, 20, .48);
      border: 1px solid rgba(255, 215, 150, .22);
      color: rgba(255, 245, 223, .88);
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }
  </style>
</head>

<body>
  <audio id="bgMusic" loop preload="auto">
    <source src="nhac/nhactrungthu.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ audio.
  </audio>

  <canvas id="c"></canvas>

  <div class="photo-hint">✨ Chạm vào một lồng đèn để mở một kỷ niệm</div>
  <div class="photo-popup" id="photoPopup" aria-hidden="true">
    <div class="photo-card">
      <button class="photo-close" id="photoClose" aria-label="Đóng">×</button>
      <img id="memoryPhoto" src="" alt="Kỷ niệm" />
    </div>
  </div>


  <img class="corner-lantern" src="pngtree-change-png-image_5648098-removebg-preview.png" alt="">

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
    });


    function rand(a, b) { return a + Math.random() * (b - a) }
    function lerp(a, b, t) { return a + (b - a) * t }


    const focalLength = 1000;
    const zMin = 0.1;
    const zMax = 2.0;
    class Lantern {
      constructor() {
        this.reset(true);
      }
      reset(top = false) {
        this.size = rand(38, 46); // lồng đèn lớn hơn, kích thước vẫn khá đồng đều
        this.x = rand(-0.1 * W, 1.1 * W);
        this.y = top ? rand(-H * 0.5, -10) : rand(-H * 0.2, -10);
        this.z = rand(zMin, zMax);
        this.vx = rand(-0.3, 0.3);
        this.vy = rand(0.07, 0.11); // tốc độ rơi chậm và đồng đều hơn
        this.vz = rand(-0.01, 0.01);
        this.phase = rand(0, Math.PI * 2);
        this.sway = rand(10, 40);
        this.rotation = rand(-0.08, 0.08);
        this.color = this.pickColor();
        this.glow = rand(0.6, 1.2);
        this.alpha = rand(0.7, 0.95);
        this.age = 0;
        this.maxAge = rand(60, 220);
        this.twinkle = Math.random();
        this.depth = rand(0.6, 1.4);
      }
      pickColor() {
        const palettes = [
          ['#ffd59e', '#ffb86b', '#ff7a45'],
          ['#fff3b0', '#ffd166', '#ffb4a2'],
          ['#ffe7f1', '#ffb6c1', '#ff7b9c']
        ];
        const p = palettes[Math.floor(rand(0, palettes.length))];
        return p[Math.floor(rand(0, p.length))];
      }
      update(dt) {
        this.age += dt;
        this.vy += 0.00008 * (this.size / 24); // gia tốc rất nhẹ
        this.x += this.vx + Math.sin(this.age * 0.02 + this.phase) * (this.sway * this.depth * 0.003);
        this.y += this.vy * (1 / this.depth);
        this.z += this.vz;

        if (this.z < zMin) this.z = zMin;
        if (this.z > zMax) this.z = zMax;
        this.rotation += Math.sin(this.age * 0.005 + this.phase) * 0.0006;
        this.alpha = 0.7 + 0.25 * Math.sin(this.age * 0.02 + this.phase * 3) * this.twinkle;

        if (this.y - this.size * (focalLength / (focalLength + this.z)) > H + 80) {
          this.reset(false);
          this.x = rand(-0.1 * W, 1.1 * W);
          this.y = -rand(10, 200);
          this.z = rand(zMin, zMax);
        }
      }
      draw(ctx, glowFactor) {
        const scale = focalLength / (focalLength + this.z);
        const px = this.x * scale + W / 2 * (1 - scale); // Perspective projection for x
        const py = this.y * scale + H / 2 * (1 - scale); // Perspective projection for y
        const scaledSize = this.size * scale;

        // Lưu vị trí thật trên màn hình để có thể click trúng lồng đèn
        this.screenX = px;
        this.screenY = py;
        this.screenSize = scaledSize;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(this.rotation);
        const gRadius = scaledSize * (2.4 + glowFactor * this.glow);
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, gRadius);
        grd.addColorStop(0, hexToRgba(this.color, 0.25 * this.alpha));
        grd.addColorStop(0.35, hexToRgba(this.color, 0.08 * this.alpha));
        grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, gRadius, 0, Math.PI * 2);
        ctx.fill();
        const w = scaledSize * 0.8;
        const h = scaledSize * 1.05;
        const bodyAlpha = Math.max(0.58, this.alpha * (1 - (this.z - zMin) / (zMax - zMin)));
        ctx.beginPath();
        roundRectPath(ctx, -w / 2, -h / 2, w, h, w * 0.45);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = bodyAlpha;
        ctx.fill();
        ctx.lineWidth = Math.max(1.5, scaledSize * 0.055);
        ctx.strokeStyle = 'rgba(55, 24, 15, 0.72)';
        ctx.stroke();
        ctx.globalAlpha = 0.18 * this.alpha;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          const ix = (i / 3) * w * 0.7;
          ctx.moveTo(ix, -h / 2);
          ctx.quadraticCurveTo(ix * 1.4, 0, ix, h / 2);
          ctx.lineWidth = Math.max(1, scaledSize * 0.045);
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        const flameY = h * 0.12;
        const flameH = scaledSize * 0.28;
        const flameW = scaledSize * 0.12;
        const flameGrd = ctx.createRadialGradient(0, flameY, 0, 0, flameY, flameH);
        flameGrd.addColorStop(0, '#fff9c8');
        flameGrd.addColorStop(0.4, '#ffd36a');
        flameGrd.addColorStop(1, 'rgba(255, 100, 50, 0)');
        ctx.fillStyle = flameGrd;
        ctx.beginPath();
        ctx.ellipse(0, flameY, flameW, flameH, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }


    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const bigint = parseInt(h, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }


    let lanterns = [];
    let LAST = performance.now();
    let glowFactor = 0.6;
    const desiredCount = 80;

    function spawn(n) {
      lanterns = [];
      for (let i = 0; i < n; i++) lanterns.push(new Lantern());
    }
    spawn(desiredCount);

    // ===== HEART FORMATION =====
    // Parametric heart curve
    function heartCurveX(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function heartCurveY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); }

    let heartTargets = [];   // {x, y} screen positions for each lantern
    let heartBlend = 0;      // 0 = rain mode, 1 = heart mode
    let heartStartTime = -1; // when transition begins
    const heartDelay = 5000;          // ms before heart starts forming
    const heartTransitionMs = 4000;   // ms for full transition
    const heartHoldMs = 8000;         // ms to hold heart shape
    const heartDissolveMs = 3000;     // ms to dissolve back to rain
    let heartCycleStart = performance.now();

    function buildHeartTargets() {
      heartTargets = [];
      const heartScale = Math.min(W, H) * 0.019;
      const cx = W * 0.5;
      const cy = H * 0.46;

      // Outline: 55 evenly-spaced points
      const outlineCount = 55;
      for (let i = 0; i < outlineCount; i++) {
        const t = (i / outlineCount) * Math.PI * 2;
        heartTargets.push({
          x: cx + heartCurveX(t) * heartScale,
          y: cy + heartCurveY(t) * heartScale
        });
      }

      // Fill: 25 points inside (shrunk outline points)
      const fillRng = seededRandom(777);
      for (let i = 0; i < 25; i++) {
        const t = fillRng() * Math.PI * 2;
        const shrink = 0.2 + fillRng() * 0.55;
        heartTargets.push({
          x: cx + heartCurveX(t) * heartScale * shrink,
          y: cy + heartCurveY(t) * heartScale * shrink
        });
      }

      // Assign targets to lanterns
      for (let i = 0; i < lanterns.length; i++) {
        const ti = i % heartTargets.length;
        lanterns[i].heartTX = heartTargets[ti].x;
        lanterns[i].heartTY = heartTargets[ti].y;
      }
    }
    buildHeartTargets();

    // Rebuild on resize
    window.addEventListener('resize', () => {
      buildHeartTargets();
    });

    // ── Seeded pseudo-random for stable moon features ──
    function seededRandom(seed) {
      let s = seed;
      return function () {
        s = (s * 16807 + 0) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // Pre-generate moon crater & maria data once
    let moonCraterData = null;
    let moonMariaData = null;
    let lastMoonRadius = -1;

    function generateMoonFeatures(scaledR) {
      const rng = seededRandom(42);
      // --- Craters ---
      const craters = [];
      const numCraters = 18;
      for (let i = 0; i < numCraters; i++) {
        const r = scaledR * (0.03 + rng() * 0.14);
        const angle = rng() * Math.PI * 2;
        const dist = rng() * (scaledR - r * 1.1);
        const ox = Math.cos(angle) * dist;
        const oy = Math.sin(angle) * dist;
        if (Math.sqrt(ox * ox + oy * oy) + r < scaledR) {
          craters.push({
            ox, oy,
            w: r * (0.85 + rng() * 0.3),
            h: r * (0.65 + rng() * 0.35),
            rot: rng() * Math.PI,
            alpha: 0.08 + rng() * 0.22,
            rimAlpha: 0.04 + rng() * 0.08
          });
        }
      }
      // --- Maria (dark patches) ---
      const maria = [];
      const mariaSeeds = [
        { ox: -0.2, oy: -0.15, rx: 0.28, ry: 0.22 },
        { ox: 0.15, oy: 0.1, rx: 0.22, ry: 0.18 },
        { ox: -0.05, oy: 0.25, rx: 0.18, ry: 0.14 },
        { ox: 0.25, oy: -0.2, rx: 0.15, ry: 0.12 },
        { ox: -0.3, oy: 0.05, rx: 0.12, ry: 0.18 }
      ];
      mariaSeeds.forEach(m => {
        maria.push({
          ox: m.ox * scaledR,
          oy: m.oy * scaledR,
          rx: m.rx * scaledR,
          ry: m.ry * scaledR,
          alpha: 0.06 + rng() * 0.06
        });
      });
      return { craters, maria };
    }

    function drawMoon(ctx) {
      const moonX = W * 0.8;
      const moonY = H * 0.15;
      const moonRadius = Math.min(W, H) * 0.1;
      const moonZ = zMax;
      const scale = focalLength / (focalLength + moonZ);
      const R = moonRadius * scale;

      // Regenerate features only when radius changes (resize)
      if (Math.abs(R - lastMoonRadius) > 0.5) {
        const features = generateMoonFeatures(R);
        moonCraterData = features.craters;
        moonMariaData = features.maria;
        lastMoonRadius = R;
      }

      // Breathing glow animation
      const now = performance.now();
      const breathe = 1 + 0.06 * Math.sin(now * 0.0008);

      ctx.save();

      // ── Layer 1: Outermost soft haze ──
      const haze = R * 5 * breathe;
      const hazeGrd = ctx.createRadialGradient(moonX, moonY, R * 0.3, moonX, moonY, haze);
      hazeGrd.addColorStop(0, 'rgba(255, 252, 230, 0.10)');
      hazeGrd.addColorStop(0.3, 'rgba(255, 248, 220, 0.04)');
      hazeGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = hazeGrd;
      ctx.beginPath();
      ctx.arc(moonX, moonY, haze, 0, Math.PI * 2);
      ctx.fill();

      // ── Layer 2: Mid glow ring ──
      const glowR = R * 3 * breathe;
      const glowGrd = ctx.createRadialGradient(moonX, moonY, R * 0.5, moonX, moonY, glowR);
      glowGrd.addColorStop(0, 'rgba(255, 250, 235, 0.45)');
      glowGrd.addColorStop(0.25, 'rgba(255, 245, 215, 0.20)');
      glowGrd.addColorStop(0.5, 'rgba(255, 240, 200, 0.08)');
      glowGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGrd;
      ctx.beginPath();
      ctx.arc(moonX, moonY, glowR, 0, Math.PI * 2);
      ctx.fill();

      // ── Layer 3: Inner corona ──
      const coronaR = R * 1.6 * breathe;
      const coronaGrd = ctx.createRadialGradient(moonX, moonY, R * 0.8, moonX, moonY, coronaR);
      coronaGrd.addColorStop(0, 'rgba(255, 253, 240, 0.55)');
      coronaGrd.addColorStop(0.5, 'rgba(255, 248, 220, 0.15)');
      coronaGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = coronaGrd;
      ctx.beginPath();
      ctx.arc(moonX, moonY, coronaR, 0, Math.PI * 2);
      ctx.fill();

      // ── Moon body: layered gradient for realistic look ──
      ctx.save();
      ctx.beginPath();
      ctx.arc(moonX, moonY, R, 0, Math.PI * 2);
      ctx.clip();

      // Base colour
      const bodyGrd = ctx.createRadialGradient(
        moonX - R * 0.25, moonY - R * 0.25, R * 0.1,
        moonX, moonY, R
      );
      bodyGrd.addColorStop(0, '#fffef5');
      bodyGrd.addColorStop(0.4, '#f5f0d8');
      bodyGrd.addColorStop(0.75, '#e8e0c0');
      bodyGrd.addColorStop(1, '#d8cfb0');
      ctx.fillStyle = bodyGrd;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      // Warm tint overlay
      const warmGrd = ctx.createRadialGradient(
        moonX + R * 0.3, moonY + R * 0.3, 0,
        moonX, moonY, R
      );
      warmGrd.addColorStop(0, 'rgba(255, 220, 160, 0.15)');
      warmGrd.addColorStop(1, 'rgba(180, 170, 140, 0.10)');
      ctx.fillStyle = warmGrd;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      // ── Maria (dark lowland regions) ──
      if (moonMariaData) {
        moonMariaData.forEach(m => {
          ctx.globalAlpha = m.alpha;
          const mGrd = ctx.createRadialGradient(
            moonX + m.ox, moonY + m.oy, 0,
            moonX + m.ox, moonY + m.oy, Math.max(m.rx, m.ry)
          );
          mGrd.addColorStop(0, 'rgba(140, 135, 115, 0.7)');
          mGrd.addColorStop(0.6, 'rgba(160, 155, 135, 0.3)');
          mGrd.addColorStop(1, 'rgba(180, 175, 155, 0)');
          ctx.fillStyle = mGrd;
          ctx.beginPath();
          ctx.ellipse(moonX + m.ox, moonY + m.oy, m.rx, m.ry, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      // ── Craters ──
      if (moonCraterData) {
        moonCraterData.forEach(c => {
          const cx = moonX + c.ox;
          const cy = moonY + c.oy;

          // Crater shadow (deeper part)
          ctx.globalAlpha = c.alpha;
          const cGrd = ctx.createRadialGradient(
            cx - c.w * 0.15, cy - c.h * 0.15, 0,
            cx, cy, Math.max(c.w, c.h)
          );
          cGrd.addColorStop(0, 'rgba(170, 165, 145, 0.9)');
          cGrd.addColorStop(0.5, 'rgba(190, 185, 165, 0.5)');
          cGrd.addColorStop(1, 'rgba(210, 205, 185, 0)');
          ctx.fillStyle = cGrd;
          ctx.beginPath();
          ctx.ellipse(cx, cy, c.w, c.h, c.rot, 0, Math.PI * 2);
          ctx.fill();

          // Crater rim (subtle highlight)
          ctx.globalAlpha = c.rimAlpha;
          ctx.strokeStyle = 'rgba(255, 252, 240, 0.4)';
          ctx.lineWidth = Math.max(0.5, c.w * 0.08);
          ctx.beginPath();
          ctx.ellipse(cx, cy, c.w * 1.02, c.h * 1.02, c.rot, Math.PI * 0.8, Math.PI * 1.8);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }

      // ── Terminator shadow (edge darkening for 3D look) ──
      const termGrd = ctx.createLinearGradient(
        moonX - R, moonY, moonX + R, moonY
      );
      termGrd.addColorStop(0, 'rgba(0, 0, 0, 0)');
      termGrd.addColorStop(0.7, 'rgba(0, 0, 0, 0)');
      termGrd.addColorStop(1, 'rgba(0, 0, 20, 0.18)');
      ctx.fillStyle = termGrd;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      // Edge vignette for spherical feel
      const edgeGrd = ctx.createRadialGradient(
        moonX - R * 0.15, moonY - R * 0.15, R * 0.4,
        moonX, moonY, R
      );
      edgeGrd.addColorStop(0, 'rgba(0, 0, 0, 0)');
      edgeGrd.addColorStop(0.85, 'rgba(0, 0, 0, 0)');
      edgeGrd.addColorStop(1, 'rgba(0, 0, 20, 0.15)');
      ctx.fillStyle = edgeGrd;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      ctx.restore(); // End clip

      // ── Specular highlight (top-left shine) ──
      ctx.globalAlpha = 0.35;
      const specGrd = ctx.createRadialGradient(
        moonX - R * 0.3, moonY - R * 0.3, 0,
        moonX - R * 0.3, moonY - R * 0.3, R * 0.6
      );
      specGrd.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      specGrd.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
      specGrd.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = specGrd;
      ctx.beginPath();
      ctx.arc(moonX, moonY, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function update() {
      const now = performance.now();
      const dt = (now - LAST) * 0.06;
      LAST = now;
      ctx.clearRect(0, 0, W, H);
      drawMoon(ctx);
      lanterns.sort((a, b) => a.z - b.z); // Sort by z-depth for correct rendering order
      for (let i = 0; i < lanterns.length; i++) {
        lanterns[i].update(dt);
      }
      for (let i = 0; i < lanterns.length; i++) {
        lanterns[i].draw(ctx, glowFactor);
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
    // ===== ẢNH KỶ NIỆM NGẪU NHIÊN =====
    // Đặt ảnh của bạn vào thư mục "anh" cùng cấp với file HTML,
    // rồi sửa danh sách tên file bên dưới nếu cần.
    const memoryImages = [
      'anh/anh1.jpg',
      'anh/anh2.jpg',
      'anh/anh3.jpg',
      'anh/anh4.jpg',
      'anh/anh5.jpg',
      'anh/anh6.jpg'
    ];

    const photoPopup = document.getElementById('photoPopup');
    const memoryPhoto = document.getElementById('memoryPhoto');
    const photoClose = document.getElementById('photoClose');
    let lastPhotoIndex = -1;

    function openRandomPhoto() {
      if (!memoryImages.length) return;
      let index = Math.floor(Math.random() * memoryImages.length);
      if (memoryImages.length > 1) {
        while (index === lastPhotoIndex) index = Math.floor(Math.random() * memoryImages.length);
      }
      lastPhotoIndex = index;
      memoryPhoto.src = memoryImages[index];
      photoPopup.classList.add('show');
      photoPopup.setAttribute('aria-hidden', 'false');
    }

    function closePhoto() {
      photoPopup.classList.remove('show');
      photoPopup.setAttribute('aria-hidden', 'true');
    }

    photoClose.addEventListener('click', (e) => {
      e.stopPropagation();
      closePhoto();
    });
    photoPopup.addEventListener('click', (e) => {
      if (e.target === photoPopup) closePhoto();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePhoto();
    });

    canvas.addEventListener('click', (e) => {
      // Ưu tiên lồng đèn gần con trỏ nhất
      let hit = null;
      let bestDistance = Infinity;
      for (const L of lanterns) {
        if (L.screenX == null || L.screenY == null) continue;
        const dx = e.clientX - L.screenX;
        const dy = e.clientY - L.screenY;
        const d = Math.hypot(dx, dy);
        const hitRadius = Math.max(18, L.screenSize * 0.75);
        if (d <= hitRadius && d < bestDistance) {
          hit = L;
          bestDistance = d;
        }
      }
      if (hit) openRandomPhoto();
    });


    const audio = document.getElementById('bgMusic');
    let musicPlayed = false;
    canvas.addEventListener('click', () => {
      if (!musicPlayed) {
        audio.play().then(() => {
          musicPlayed = true;
          console.log('Nhạc đã phát!');
        }).catch(err => {
          console.error('Lỗi phát nhạc:', err);
        });
      }
    });

    console.log('3D Lantern rain ready — open this file in a browser. Click vào màn hình để bật nhạc.');
  </script>
</body>
